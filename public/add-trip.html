<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Add Trip</title>
  <link rel="stylesheet" href="add-trip.css">
  <script async src="https://maps.googleapis.com/maps/api/js?key=AIzaSyA2Pe_WR2Fh3ieUOKSMrZre5cvpYGJ4pBU&libraries=places"></script>
</head>
<body>
  <div class="container">
    <div class="card">
      <h1>Add a New Trip</h1>
      
      <form id="add-trip-form">
        <div class="form-group">
          <label for="start-location">Start Location</label>
          <input type="text" id="start-location" name="start" required>
        </div>

        

        <div class="form-group">
          <label for="end-location">End Location</label>
          <input type="text" id="end-location" name="end" required>
        </div>

        <div class="form-group">
          <label>Stops</label>
          <div id="stops-container" class="stops-container"></div>
          <button type="button" id="add-stop-btn" class="btn-outline">Add Stop</button>
        </div>

        <div class="form-group" style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
          <div>
            <label for="startDate">Start Date</label>
            <input type="date" id="startDate" name="startDate" required>
          </div>
          
          <div>
            <label for="endDate">End Date</label>
            <input type="date" id="endDate" name="endDate" required>
          </div>
        </div>

        <div class="form-group">
          <label for="expense">Expense</label>
          <input type="number" id="expense" name="expense" required min="0" step="0.01">
        </div>

        <div class="form-group">
          <label for="description">Description</label>
          <textarea id="description" name="description" required rows="4"></textarea>
        </div>
        
       
        
        <div class="media-section">
          <div class="form-group">
            <label for="banner-file">Banner Photo</label>
            <input type="file" id="banner-file" accept="image/*" required>
          </div>

          <div class="form-group">
            <label>Additional Photos & Videos</label>
            <input type="file" id="media-files" multiple accept="image/*,video/*">
            <div id="media-preview" class="media-grid"></div>
          </div>
        </div>
        
        <div class="form-group">
          <label for="visibility">Visibility</label>
          <select id="visibility" name="visibility" required>
            <option value="public">Public</option>
            <option value="private">Private</option>
          </select>
        </div>
        
        <button type="submit" class="btn-primary" style="width: 100%;">Submit</button>
      </form>
    </div>
  </div>

  <script type="module" src="add-trip.js"></script>
</body>
</html>
