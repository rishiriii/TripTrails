<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Add Trip</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>Add a New Trip</h1>
  
  <form id="add-trip-form">
    <label>Start Location: <input type="text" name="start" required></label><br>
    <label>End Location: <input type="text" name="end" required></label><br>
    <label>Start Date: <input type="date" name="startDate" required></label><br>
    <label>End Date: <input type="date" name="endDate" required></label><br>
    <label>Expense: <input type="number" name="expense" required></label><br>
    <label>Description: <textarea name="description" required></textarea></label><br>
    
    <div id="stops-section">
      <h3>Stops</h3>
      <div id="stops-container"></div>
      <input type="text" id="stop-input" placeholder="Enter a stop" />
      <button type="button" id="add-stop-btn">Add Stop</button>
    </div>
    
    <div id="media-section">
      <h3>Media</h3>
      <label>Banner Photo: <input type="file" id="banner-file" accept="image/*" required></label><br>
      <div id="additional-media">
        <h4>Additional Photos & Videos</h4>
        <input type="file" id="media-files" multiple accept="image/*,video/*">
        <div id="media-preview"></div>
      </div>
    </div>
    
    <label>Visibility:
      <select name="visibility" required>
        <option value="public">Public</option>
        <option value="private">Private</option>
      </select>
    </label><br>
    
    <button type="submit">Submit</button>
  </form>

  <script type="module" src="add-trip.js"></script>
</body>
</html>
