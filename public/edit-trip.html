<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Edit Trip</title>
  <link rel="stylesheet" href="edit-trip.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
  <script async src="https://maps.googleapis.com/maps/api/js?key=AIzaSyA2Pe_WR2Fh3ieUOKSMrZre5cvpYGJ4pBU&libraries=places"></script>


</head>
<body>
  

  <div class="container">
    <div class="card">
      
      <form id="edit-trip-form">
        <div class="form-group">
          <label for="title">Title</label>
          <input type="text" id="title" name="title" readonly>
        </div>

        <div class="form-group">
          <label for="start">Start Location</label>
          <input type="text" id="start" name="start" required>
        </div>

        <div class="form-group">
          <label>Stops</label>
          <div id="stops-container" class="stops-container"></div>
          <button type="button" id="add-stop-btn" class="btn-outline">Add Stop</button>
        </div>

        <div class="form-group">
          <label for="end">End Location</label>
          <input type="text" id="end" name="end" required>
        </div>

        <div class="form-group" style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
          <div>
            <label for="startDate">Start Date</label>
            <input type="date" id="startDate" name="startDate" required>
          </div>
          <div>
            <label for="endDate">End Date</label>
            <input type="date" id="endDate" name="endDate" required>
          </div>
        </div>

        <div class="duration-display" id="duration-display">
          0 days / 0 nights
        </div>

        <div class="form-group">
          <label for="expense">Expense</label>
          <input type="number" id="expense" name="expense" required min="0" step="0.01">
        </div>

        <div class="form-group">
          <label for="description">Description</label>
          <textarea id="description" name="description" required rows="4"></textarea>
        </div>

        <div class="media-section">
          <div class="form-group">
            <label>Banner Photo</label>
            <div id="current-banner" class="media-preview"></div>
            <input type="file" id="banner-file" accept="image/*">
          </div>

          <div class="form-group">
            <label>Additional Media</label>
            <div id="current-media" class="media-grid"></div>
            <input type="file" id="additional-media" multiple accept="image/*,video/*">
            <div id="new-media-preview" class="media-grid"></div>
          </div>
        </div>

        <button type="submit" class="btn-primary" style="width: 100%;">Save Changes</button>
      </form>
    </div>
  </div>
  <script type="module" src="edit-trip.js"></script>
</body>
</html>
