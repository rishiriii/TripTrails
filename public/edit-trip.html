<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Edit Trip</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header>
    <div id="profile-container" class="profile-container"></div>
  </header>
  <main>
    <h1>Edit Trip</h1>
    <form id="edit-trip-form">
      <label for="title">Title:</label>
      <input type="text" id="title" name="title" required>
      <label for="start">Start:</label>
      <input type="text" id="start" name="start" required>
      <label for="end">End:</label>
      <input type="text" id="end" name="end" required>
      <label for="days">Days:</label>
      <input type="number" id="days" name="days" required>
      <label for="nights">Nights:</label>
      <input type="number" id="nights" name="nights" required>
      <label for="expense">Expense:</label>
      <input type="number" id="expense" name="expense" required>
      <label for="description">Description:</label>
      <textarea id="description" name="description" required></textarea>
      <button type="submit">Save Changes</button>
    </form>
  </main>
  <script type="module" src="edit-trip.js"></script>
</body>
</html>
