<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign Up</title>
  <link rel="stylesheet" href="login-signup.css">
</head>
<body>
  <h1>Sign Up</h1>
  <form id="signup-form">
    <label>Email: <input type="email" id="signup-email" required></label><br>
    <label>Password: <input type="password" id="signup-password" required></label><br>
    <button type="submit">Sign Up</button>
  </form>
  <p>Already have an account? <a href="login.html">Login here</a></p>

  <script type="module" src="signup.js"></script>
</body>
</html>
