<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Trip Details</title>
  <link rel="stylesheet" href="trip-details-styles.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/js/all.min.js"></script>
  <script>
    function initGoogleMapsAPI() {
      console.log('Google Maps API loading callback triggered');
      window.googleMapsLoaded = true;
      if (window.initMap) {
        window.initMap();
      }
    }
  </script>
  <script 
    src="https://maps.googleapis.com/maps/api/js?key=AIzaSyAPXgT6iz0WNEHutlz5eaWdAL9mIZeriIE&libraries=places"
    async
    defer
  ></script>
</head>
<body>
  <div class="container">
    <a href="javascript:history.back()" class="back-button">← Back</a>

    <!-- Media Grid -->
    <div class="media-grid" id="media-grid">
      <!-- Images will be dynamically inserted here -->
    </div>

    <!-- Trip Info -->
    <div class="trip-header">
      <h1 id="trip-title"></h1>
      <div class="author-info" id="author-info">
          <img id="author-photo" src="/images/default-profile.jpg" alt="Author photo">
          <span id="trip-username">Posted by: Loading...</span>
      </div>
    </div>

    <div class="trip-stats">
      <div class="stat-item">
        <h4>Duration</h4>
        <p id="trip-days"></p>
      </div>
      <div class="stat-item">
        <h4>Route</h4>
        <p id="trip-start-end"></p>
      </div>
      <div class="stat-item">
        <h4>Cost</h4>
        <p id="trip-expense"></p>
      </div>
    </div>

    <div class="trip-description">
      <h4>About this trip</h4>
      <p id="trip-description"></p>
    </div>

    <!-- Timeline -->
    <div class="timeline-container">
      <h2>Trip Route</h2>
      <ul id="trip-stops"></ul>
    </div>

    <!-- Engagement Section -->
    <div class="engagement-section">
      <div class="stat">
        <i class="fas fa-eye"></i> <span id="viewCount">0</span>
      </div>
      <button id="likeButton" class="like-button">
        <i class="fas fa-heart"></i> <span id="likeCount">0</span>
      </button>
      <div class="share-container">
        <button class="share-button">
          <i class="fas fa-share-alt"></i> Share
        </button>
        <div class="share-dropdown">
          <button class="share-option" data-platform="copy">
            <i class="fas fa-link"></i> Copy Link
          </button>
          <button class="share-option" data-platform="facebook">
            <i class="fab fa-facebook"></i> Facebook
          </button>
          <button class="share-option" data-platform="twitter">
            <i class="fab fa-twitter"></i> Twitter
          </button>
          <button class="share-option" data-platform="whatsapp">
            <i class="fab fa-whatsapp"></i> WhatsApp
          </button>
        </div>
        
      </div>
      <button id="reportButton" class="report-button">
        <i class="fas fa-flag"></i> Report
      </button>
    </div>
    
    <!-- Modal Overlay -->
    <div id="modalOverlay"></div>
    
    <!-- Report Modal -->
    <div id="reportModal">
      <div class="modal-content">
        <div class="modal-header">
          <h2>Report Trip</h2>
          <button class="close-button">&times;</button>
        </div>
        <div class="modal-body">
          <form id="reportForm">
            <div class="form-group">
              <label for="reportReason">Reason for reporting:</label>
              <select id="reportReason" required>
                <option value="">Select a reason</option>
                <option value="inappropriate">Inappropriate content</option>
                <option value="misleading">Misleading information</option>
                <option value="spam">Spam</option>
                <option value="copyright">Copyright violation</option>
                <option value="other">Other</option>
              </select>
            </div>
            <div class="form-group">
              <label for="reportDetails">Additional details:</label>
              <textarea id="reportDetails" rows="4" placeholder="Provide more information..."></textarea>
            </div>
            <div class="form-actions">
              <button type="button" class="cancel-button">Cancel</button>
              <button type="submit" class="submit-button">Submit Report</button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>


  

  <script type="module" src="trip-details.js"></script>
  <script type="module" src="trip-report.js"></script>
</body>
</html>
