<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Trip Details</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="trip-banner"></div>
  <div class="trip-container">
    <h1 id="trip-title"></h1>
    <div class="trip-info">
      <p id="trip-start-end"></p>
      <p id="trip-days"></p>
      <p id="trip-expense"></p>
      <p id="trip-description"></p>
    </div>

    <div class="timeline-container">
      <h3>Trip Route</h3>
      <div class="timeline">
        <div class="timeline-track"></div>
        <div id="trip-stops" class="timeline-stops">
          <!-- Stops will be populated here -->
        </div>
      </div>
    </div>

    <div class="media-gallery">
      <h3>Photos & Videos</h3>
      <div id="media-container" class="media-grid"></div>
    </div>

    <p id="trip-username" class="trip-author"></p>
  </div>

  <script type="module" src="trip-details.js"></script>
</body>
</html>
